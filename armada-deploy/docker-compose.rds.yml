services:
  backend:
    build:
      context: .
      dockerfile: backend.prebuilt.Dockerfile
    container_name: armada-backend
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      SPRING_FLYWAY_OUT_OF_ORDER: ${SPRING_FLYWAY_OUT_OF_ORDER:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-kafka}
      SPRING_TASK_SCHEDULING_POOL_SIZE: ${SPRING_TASK_SCHEDULING_POOL_SIZE:-4}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: ${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL:-}
      ARMADA_PROTOCOL_BASE_URL: ${ARMADA_PROTOCOL_BASE_URL:-http://65.2.122.109:8080}
      PROTOCOL_ANDROID_BASE_URL: ${PROTOCOL_ANDROID_BASE_URL:-http://localhost:8000}
      ARMADA_PROTOCOL_API_KEY: ${ARMADA_PROTOCOL_API_KEY:-}
      ARMADA_PROTOCOL_RESTART_MASTER_READY_URL: ${ARMADA_PROTOCOL_RESTART_MASTER_READY_URL:-http://65.2.122.109:8080/readyz}
      ARMADA_PROTOCOL_RESTART_WORKER_1_READY_URL: ${ARMADA_PROTOCOL_RESTART_WORKER_1_READY_URL:-http://65.2.122.109:8081/readyz}
      ARMADA_PROTOCOL_RESTART_WORKER_2_READY_URL: ${ARMADA_PROTOCOL_RESTART_WORKER_2_READY_URL:-http://65.2.122.109:8082/readyz}
      ARMADA_PROTOCOL_RESTART_WORKER_3_READY_URL: ${ARMADA_PROTOCOL_RESTART_WORKER_3_READY_URL:-http://65.2.122.109:8083/readyz}
      ARMADA_PROTOCOL_RESTART_WORKER_4_READY_URL: ${ARMADA_PROTOCOL_RESTART_WORKER_4_READY_URL:-http://65.2.122.109:8084/readyz}
      ANDROID_IMAGE_REDIS_MODE: ${ANDROID_IMAGE_REDIS_MODE:-standalone}
      ANDROID_IMAGE_REDIS_ADDRESSES: ${ANDROID_IMAGE_REDIS_ADDRESSES}
      ANDROID_IMAGE_REDIS_USERNAME: ${ANDROID_IMAGE_REDIS_USERNAME:-}
      ANDROID_IMAGE_REDIS_PASSWORD: ${ANDROID_IMAGE_REDIS_PASSWORD:-}
      ANDROID_IMAGE_REDIS_DATABASE: ${ANDROID_IMAGE_REDIS_DATABASE:-0}
      ANDROID_IMAGE_REDIS_TLS: ${ANDROID_IMAGE_REDIS_TLS:-false}
      ANDROID_IMAGE_REDIS_KEY_PREFIX: ${ANDROID_IMAGE_REDIS_KEY_PREFIX:-android-zhuan:}
      AUTH_SESSION_KEY_PREFIX: ${AUTH_SESSION_KEY_PREFIX:-armada:default:}
      PROMOTION_TRACKING_ENCRYPTION_KEY: ${PROMOTION_TRACKING_ENCRYPTION_KEY:?PROMOTION_TRACKING_ENCRYPTION_KEY is required}
      PROMOTION_TRACKING_ENCRYPTION_KEY_ID: ${PROMOTION_TRACKING_ENCRYPTION_KEY_ID:?PROMOTION_TRACKING_ENCRYPTION_KEY_ID is required}
      ARMADA_PROMOTION_TRACKING_FACEBOOK_PROBE_ENABLED: ${ARMADA_PROMOTION_TRACKING_FACEBOOK_PROBE_ENABLED:-false}
      PROTOCOL_ACCOUNT_COMMANDS_TOPIC: ${PROTOCOL_ACCOUNT_COMMANDS_TOPIC:-protocol.account.commands.v1}
      PROTOCOL_MASTER_COMMANDS_TOPIC: ${PROTOCOL_MASTER_COMMANDS_TOPIC:-protocol.master.commands.v1}
      PROTOCOL_ANDROID_LIFECYCLE_COMMANDS_TOPIC: ${PROTOCOL_ANDROID_LIFECYCLE_COMMANDS_TOPIC:-protocol.android.lifecycle.commands.v1}
      PROTOCOL_ANDROID_MESSAGE_COMMANDS_TOPIC: ${PROTOCOL_ANDROID_MESSAGE_COMMANDS_TOPIC:-protocol.android.message.commands.v1}
      PROTOCOL_ANDROID_GROUP_JOIN_COMMANDS_TOPIC: ${PROTOCOL_ANDROID_GROUP_JOIN_COMMANDS_TOPIC:-protocol.android.group-join.commands.v1}
      PROTOCOL_ACCOUNT_STATE_EVENTS_TOPIC: ${PROTOCOL_ACCOUNT_STATE_EVENTS_TOPIC:-protocol.account.state.events.v1}
      PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_TOPIC: ${PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_TOPIC:-protocol.account.group-sync.events.v1}
      ARMADA_PROTOCOL_KAFKA_MESSAGE_EVENTS_TOPIC: ${PROTOCOL_MESSAGE_EVENTS_TOPIC:-protocol.message.events.v1}
      PROTOCOL_GROUP_EVENTS_TOPIC: ${PROTOCOL_GROUP_EVENTS_TOPIC:-protocol.group.events.v1}
      PROTOCOL_ACCOUNT_STATE_EVENTS_GROUP_ID: ${PROTOCOL_ACCOUNT_STATE_EVENTS_GROUP_ID:-armada-api-account-state-events}
      PROTOCOL_ACCOUNT_STATE_EVENTS_CONCURRENCY: ${PROTOCOL_ACCOUNT_STATE_EVENTS_CONCURRENCY:-4}
      PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_GROUP_ID: ${PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_GROUP_ID:-armada-api-account-group-sync-events}
      PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_CONCURRENCY: ${PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_CONCURRENCY:-4}
      ARMADA_PROTOCOL_KAFKA_MESSAGE_EVENTS_GROUP_ID: ${PROTOCOL_MESSAGE_EVENTS_GROUP_ID:-armada-api-message-events}
      PROTOCOL_GROUP_EVENTS_GROUP_ID: ${PROTOCOL_GROUP_EVENTS_GROUP_ID:-armada-api-group-events}
      PROTOCOL_COMMAND_DISPATCH_IMMEDIATE_ENABLED: ${PROTOCOL_COMMAND_DISPATCH_IMMEDIATE_ENABLED:-true}
      PROTOCOL_COMMAND_DISPATCH_SCHEDULER_ENABLED: ${PROTOCOL_COMMAND_DISPATCH_SCHEDULER_ENABLED:-true}
      ACCOUNT_IMPORT_ONLINE_DISPATCH_SCHEDULER_ENABLED: ${ACCOUNT_IMPORT_ONLINE_DISPATCH_SCHEDULER_ENABLED:-true}
      IP_PROXY_UNAVAILABLE_RECHECK_BATCH_SIZE: 200
      ARMADA_IP_PROXY_UNAVAILABLE_RECHECK_BATCH_SIZE: 200
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:-armada123}
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms1024m -Xmx1024m}"
      LOGGING_FILE_NAME: /app/logs/armada-api.log
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 500MB
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: 10
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP: 5GB
      ARMADA_MARKETING_EXPORT_STORAGE_DIR: /app/data/marketing-exports
      ARMADA_PULL_TASK_AVATAR_STORAGE_DIR: ${ARMADA_PULL_TASK_AVATAR_STORAGE_DIR:-/app/data/pull-task-avatars}
    volumes:
      - ./logs/backend:/app/logs
      - ./data/marketing-exports:/app/data/marketing-exports
      - ${ARMADA_PULL_TASK_AVATAR_HOST_DIR:-./data/pull-task-avatars}:/app/data/pull-task-avatars
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "5"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx.prebuilt.Dockerfile
    container_name: armada-nginx
    depends_on:
      - backend
    environment:
      APP_TITLE: ${APP_TITLE:-Wheel SaaS}
    ports:
      - "${ARMADA_HTTP_PORT:-18080}:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "5"
    restart: unless-stopped
