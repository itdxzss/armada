name: armada-group-marketing-e2e

services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: armada_e2e
      MYSQL_USER: armada_e2e
      MYSQL_PASSWORD: armada_e2e
      MYSQL_ROOT_PASSWORD: armada_e2e_root
    ports:
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uarmada_e2e -parmada_e2e --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
