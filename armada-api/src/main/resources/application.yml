spring:
  application:
    name: armada-api
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/armada?useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: latest
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

armada:
  pull-task:
    avatar:
      storage-dir: ${ARMADA_PULL_TASK_AVATAR_STORAGE_DIR:/app/data/pull-task-avatars}
      cleanup-fixed-delay-ms: ${ARMADA_PULL_TASK_AVATAR_CLEANUP_FIXED_DELAY_MS:3600000}
      pending-ttl-ms: ${ARMADA_PULL_TASK_AVATAR_PENDING_TTL_MS:86400000}
  group-pull-marketing:
    scheduler:
      # 拉群营销资源分配、到期建群和安全释放三个扫描阶段的固定延迟（毫秒）。
      fixed-delay-ms: ${GROUP_PULL_MARKETING_SCHEDULER_FIXED_DELAY_MS:1000}
  promotion:
    tracking:
      # Base64 编码的 32 字节 AES-256 密钥；无 Token 的渠道不依赖该配置。
      encryption-key: ${PROMOTION_TRACKING_ENCRYPTION_KEY:}
      encryption-key-id: ${PROMOTION_TRACKING_ENCRYPTION_KEY_ID:}
    pairing:
      expiry-scan:
        enabled: ${PROMOTION_PAIRING_EXPIRY_SCAN_ENABLED:true}
        fixed-delay-ms: ${PROMOTION_PAIRING_EXPIRY_SCAN_FIXED_DELAY_MS:30000}
        batch-size: ${PROMOTION_PAIRING_EXPIRY_SCAN_BATCH_SIZE:100}
    capi-dispatcher:
      batch-size: ${PROMOTION_CAPI_DISPATCH_BATCH_SIZE:100}
      max-retry-count: ${PROMOTION_CAPI_MAX_RETRY_COUNT:6}
      retry-delay-ms: ${PROMOTION_CAPI_RETRY_DELAY_MS:30000}
      locked-timeout-ms: ${PROMOTION_CAPI_LOCKED_TIMEOUT_MS:60000}
      privacy-cleanup:
        fixed-delay-ms: ${PROMOTION_CAPI_PRIVACY_CLEANUP_DELAY_MS:3600000}
        batch-size: ${PROMOTION_CAPI_PRIVACY_CLEANUP_BATCH_SIZE:500}
      scheduler:
        enabled: ${PROMOTION_CAPI_SCHEDULER_ENABLED:true}
        fixed-delay-ms: ${PROMOTION_CAPI_SCHEDULER_FIXED_DELAY_MS:5000}
        recovery-delay-ms: ${PROMOTION_CAPI_RECOVERY_DELAY_MS:60000}
  # 进群专用调度线程只做到期扫描和 outbox 入队；batch-size 是单轮上限，不是账号并行上限。
  task:
    join-dispatcher:
      # 紧急停派开关：关闭后不再产生新命令，已提交 outbox 仍由通用 dispatcher 处理。
      enabled: ${JOIN_TASK_DISPATCHER_ENABLED:true}
      # 固定延迟从上一轮结束后开始计算，避免慢轮次叠加。
      fixed-delay-ms: ${JOIN_TASK_DISPATCHER_FIXED_DELAY_MS:1000}
      # 单轮跨租户候选上限；上百账号会分轮处理，不会丢弃或限制为固定 lane 数。
      batch-size: ${JOIN_TASK_DISPATCHER_BATCH_SIZE:500}
  ip-proxy-check:
    executor:
      core-size: ${IP_PROXY_CHECK_EXECUTOR_CORE_SIZE:4}
      max-size: ${IP_PROXY_CHECK_EXECUTOR_MAX_SIZE:12}
      queue-capacity: ${IP_PROXY_CHECK_EXECUTOR_QUEUE_CAPACITY:5000}
    timeout:
      connect-ms: ${IP_PROXY_CHECK_CONNECT_TIMEOUT_MS:5000}
      read-ms: ${IP_PROXY_CHECK_READ_TIMEOUT_MS:8000}
      total-ms: ${IP_PROXY_CHECK_TOTAL_TIMEOUT_MS:15000}
  ip-proxy-unavailable-recheck:
    enabled: ${IP_PROXY_UNAVAILABLE_RECHECK_ENABLED:true}
    fixed-delay-ms: ${IP_PROXY_UNAVAILABLE_RECHECK_FIXED_DELAY_MS:900000}
    batch-size: ${IP_PROXY_UNAVAILABLE_RECHECK_BATCH_SIZE:200}
  # 协议层连接配置。默认连本机 armada-protocol;测试/部署环境按 yml 覆盖。
  protocol:
    base-url: http://localhost:3000
    api-key: ""
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    # 新调用按协议后端读取独立连接配置；上面的旧字段继续兼容现有 Web adapter。
    backends:
      WEB:
        # 新的分后端配置优先；未配置时继续继承部署脚本长期使用的 ARMADA_PROTOCOL_* 变量。
        base-url: ${PROTOCOL_WEB_BASE_URL:${ARMADA_PROTOCOL_BASE_URL:${PROTOCOL_BASE_URL:http://localhost:3000}}}
        api-key: ${PROTOCOL_WEB_API_KEY:${ARMADA_PROTOCOL_API_KEY:${PROTOCOL_API_KEY:}}}
        connect-timeout-ms: ${PROTOCOL_WEB_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${PROTOCOL_WEB_READ_TIMEOUT_MS:60000}
      ANDROID:
        base-url: ${PROTOCOL_ANDROID_BASE_URL:http://localhost:8000}
        api-key: ${PROTOCOL_ANDROID_API_KEY:}
        connect-timeout-ms: ${PROTOCOL_ANDROID_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${PROTOCOL_ANDROID_READ_TIMEOUT_MS:60000}
    android-image-cache:
      redis:
        mode: ${ANDROID_IMAGE_REDIS_MODE:standalone}
        addresses: ${ANDROID_IMAGE_REDIS_ADDRESSES:localhost:6379}
        username: ${ANDROID_IMAGE_REDIS_USERNAME:}
        password: ${ANDROID_IMAGE_REDIS_PASSWORD:}
        database: ${ANDROID_IMAGE_REDIS_DATABASE:0}
        tls: ${ANDROID_IMAGE_REDIS_TLS:false}
        # 必须与同环境 Android Zhuan 的 redis.keyprefix 完全一致。
        key-prefix: ${ANDROID_IMAGE_REDIS_KEY_PREFIX:android-zhuan:}
    group-create-idempotency:
      # 建群 operationId 在 Redis 中的键前缀，用于隔离不同业务键空间。
      key-prefix: ${GROUP_CREATE_IDEMPOTENCY_KEY_PREFIX:armada:group-create:idempotency:}
      # 建群幂等结果保留时间；保留期内相同 operationId 不会重复创建群组。
      ttl: ${GROUP_CREATE_IDEMPOTENCY_TTL:30d}
    command-publisher:
      send-timeout-ms: ${PROTOCOL_COMMAND_SEND_TIMEOUT_MS:10000}
      max-in-flight: ${PROTOCOL_COMMAND_MAX_IN_FLIGHT:100}
    command-dispatcher:
      immediate-enabled: ${PROTOCOL_COMMAND_DISPATCH_IMMEDIATE_ENABLED:true}
      batch-size: ${PROTOCOL_COMMAND_DISPATCH_BATCH_SIZE:100}
      max-batches-per-drain: ${PROTOCOL_COMMAND_DISPATCH_MAX_BATCHES_PER_DRAIN:5}
      max-retry-count: ${PROTOCOL_COMMAND_DISPATCH_MAX_RETRY_COUNT:3}
      retry-delay-ms: ${PROTOCOL_COMMAND_DISPATCH_RETRY_DELAY_MS:30000}
      locked-timeout-ms: ${PROTOCOL_COMMAND_DISPATCH_LOCKED_TIMEOUT_MS:60000}
      scheduler:
        enabled: ${PROTOCOL_COMMAND_DISPATCH_SCHEDULER_ENABLED:true}
        fixed-delay-ms: ${PROTOCOL_COMMAND_DISPATCH_SCHEDULER_FIXED_DELAY_MS:10000}
    kafka:
      account-commands:
        topic: ${PROTOCOL_ACCOUNT_COMMANDS_TOPIC:protocol.account.commands.v1}
      android-commands:
        lifecycle-topic: ${PROTOCOL_ANDROID_LIFECYCLE_COMMANDS_TOPIC:protocol.android.lifecycle.commands.v1}
        message-topic: ${PROTOCOL_ANDROID_MESSAGE_COMMANDS_TOPIC:protocol.android.message.commands.v1}
        group-join-topic: ${PROTOCOL_ANDROID_GROUP_JOIN_COMMANDS_TOPIC:protocol.android.group-join.commands.v1}
        group-action-topic: ${PROTOCOL_ANDROID_GROUP_ACTION_COMMANDS_TOPIC:protocol.android.group-action.commands.v1}
      master-commands:
        topic: ${PROTOCOL_MASTER_COMMANDS_TOPIC:${PROTOCOL_COMMANDS_TOPIC:protocol.master.commands.v1}}
      account-state-events:
        topic: ${PROTOCOL_ACCOUNT_STATE_EVENTS_TOPIC:protocol.account.state.events.v1}
        group-id: ${PROTOCOL_ACCOUNT_STATE_EVENTS_GROUP_ID:armada-api-account-state-events}
        concurrency: ${PROTOCOL_ACCOUNT_STATE_EVENTS_CONCURRENCY:4}
      account-group-sync-events:
        topic: ${PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_TOPIC:protocol.account.group-sync.events.v1}
        group-id: ${PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_GROUP_ID:armada-api-account-group-sync-events}
        concurrency: ${PROTOCOL_ACCOUNT_GROUP_SYNC_EVENTS_CONCURRENCY:4}
      account-event-errors:
        retry-interval-ms: ${PROTOCOL_ACCOUNT_EVENTS_RETRY_INTERVAL_MS:1000}
        max-retry-attempts: ${PROTOCOL_ACCOUNT_EVENTS_MAX_RETRY_ATTEMPTS:3}
        dead-letter-topic-suffix: ${PROTOCOL_ACCOUNT_EVENTS_DLT_SUFFIX:.DLT}
      pairing-events:
        topic: ${PROTOCOL_PAIRING_EVENTS_TOPIC:protocol.pairing.events.v1}
        group-id: ${PROTOCOL_PAIRING_EVENTS_GROUP_ID:armada-api-pairing-events}
      group-events:
        topic: ${PROTOCOL_GROUP_EVENTS_TOPIC:protocol.group.events.v1}
        group-id: ${PROTOCOL_GROUP_EVENTS_GROUP_ID:armada-api-group-events}
  protocol-restart:
    pm2-bin: ${ARMADA_PROTOCOL_RESTART_PM2_BIN:pm2}
    process-names:
      - ${ARMADA_PROTOCOL_RESTART_MASTER_PROCESS:protocol-master}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_1_PROCESS:protocol-worker-1}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_2_PROCESS:protocol-worker-2}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_3_PROCESS:protocol-worker-3}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_4_PROCESS:protocol-worker-4}
    ready-urls:
      - ${ARMADA_PROTOCOL_RESTART_MASTER_READY_URL:http://127.0.0.1:8080/readyz}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_1_READY_URL:http://127.0.0.1:8081/readyz}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_2_READY_URL:http://127.0.0.1:8082/readyz}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_3_READY_URL:http://127.0.0.1:8083/readyz}
      - ${ARMADA_PROTOCOL_RESTART_WORKER_4_READY_URL:http://127.0.0.1:8084/readyz}
    command-timeout-ms: ${ARMADA_PROTOCOL_RESTART_COMMAND_TIMEOUT_MS:30000}
    ready-timeout-ms: ${ARMADA_PROTOCOL_RESTART_READY_TIMEOUT_MS:60000}
    ready-poll-interval-ms: ${ARMADA_PROTOCOL_RESTART_READY_POLL_INTERVAL_MS:1000}
    ready-request-timeout-ms: ${ARMADA_PROTOCOL_RESTART_READY_REQUEST_TIMEOUT_MS:2000}
  account:
    import-online-dispatcher:
      scheduler:
        enabled: ${ACCOUNT_IMPORT_ONLINE_DISPATCH_SCHEDULER_ENABLED:true}
        fixed-delay-ms: ${ACCOUNT_IMPORT_ONLINE_DISPATCH_SCHEDULER_FIXED_DELAY_MS:10000}
  account-group-sync:
    enabled: ${ACCOUNT_GROUP_SYNC_ENABLED:false}
    fixed-delay-ms: ${ACCOUNT_GROUP_SYNC_FIXED_DELAY_MS:180000}
    batch-size: ${ACCOUNT_GROUP_SYNC_BATCH_SIZE:500}
  auth:
    default-tenant-id: ${AUTH_DEFAULT_TENANT_ID:1}
    captcha-ttl: ${AUTH_CAPTCHA_TTL:2m}
    session-idle-timeout: ${AUTH_SESSION_IDLE_TIMEOUT:30m}
    session-max-lifetime: ${AUTH_SESSION_MAX_LIFETIME:24h}
    session-key-prefix: ${AUTH_SESSION_KEY_PREFIX:armada:default:}
