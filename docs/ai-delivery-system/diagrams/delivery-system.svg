<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Armada AI delivery system</title>
  <desc id="desc">Business input is converted into a signed acceptance contract, implemented by four project agents, verified by staging-accept and independent AI validators, then accepted, repaired, or returned for a decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60758a"/>
    </marker>
    <style>
      .box { fill:#f7f9fc; stroke:#52606d; stroke-width:2; rx:14; }
      .control { fill:#e8f1ff; }
      .decision { fill:#fff4d6; }
      .success { fill:#dff5e8; }
      .failure { fill:#fde8e8; }
      .line { fill:none; stroke:#60758a; stroke-width:2.2; marker-end:url(#arrow); }
      .label { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#263645; text-anchor:middle; }
      .small { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#52606d; text-anchor:middle; }
      .edge { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#415466; text-anchor:middle; }
      .lane { font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#728295; letter-spacing:1px; }
    </style>
  </defs>

  <text class="lane" x="45" y="45">REQUIREMENT</text>
  <text class="lane" x="45" y="250">IMPLEMENTATION</text>
  <text class="lane" x="45" y="510">ACCEPTANCE</text>

  <rect class="box" x="60" y="85" width="190" height="78"/>
  <text class="label" x="155" y="119">Business idea</text>
  <text class="small" x="155" y="143">problem, not feature copy</text>

  <rect class="box" x="315" y="85" width="220" height="78"/>
  <text class="label" x="425" y="116">AI fact &amp; impact</text>
  <text class="small" x="425" y="142">four silent analysis passes</text>

  <rect class="box decision" x="600" y="85" width="205" height="78"/>
  <text class="label" x="702" y="116">Decision pack</text>
  <text class="small" x="702" y="142">at most 7 blockers</text>

  <rect class="box decision" x="870" y="65" width="235" height="118"/>
  <text class="label" x="987" y="108">Business / technical</text>
  <text class="label" x="987" y="134">owner</text>
  <text class="small" x="987" y="160">D2 product · D3 risk</text>

  <rect class="box success" x="1180" y="85" width="300" height="78"/>
  <text class="label" x="1330" y="116">Signed acceptance contract</text>
  <text class="small" x="1330" y="142">scope hash + explicit non-goals</text>

  <path class="line" d="M250 124 H315"/>
  <path class="line" d="M535 124 H600"/>
  <path class="line" d="M805 124 H870"/>
  <text class="edge" x="837" y="108">decisions only</text>
  <path class="line" d="M1105 124 H1180"/>

  <rect class="box control" x="620" y="260" width="360" height="78"/>
  <text class="label" x="800" y="292">AI delivery orchestrator</text>
  <text class="small" x="800" y="318">one candidate · one scope · bounded WIP</text>
  <path class="line" d="M1330 163 V220 H800 V260"/>

  <rect class="box" x="125" y="390" width="250" height="78"/>
  <text class="label" x="250" y="422">Backend agent</text>
  <text class="small" x="250" y="448">Java · DB · Kafka</text>

  <rect class="box" x="425" y="390" width="250" height="78"/>
  <text class="label" x="550" y="422">Frontend agent</text>
  <text class="small" x="550" y="448">Vue · Playwright</text>

  <rect class="box" x="725" y="390" width="250" height="78"/>
  <text class="label" x="850" y="422">Web protocol agent</text>
  <text class="small" x="850" y="448">Baileys · Web traffic</text>

  <rect class="box" x="1025" y="390" width="250" height="78"/>
  <text class="label" x="1150" y="422">Android protocol agent</text>
  <text class="small" x="1150" y="448">Go fleet · Android traffic</text>

  <path class="line" d="M800 338 V365 H250 V390"/>
  <path class="line" d="M800 338 V365 H550 V390"/>
  <path class="line" d="M800 338 V390"/>
  <path class="line" d="M800 338 V365 H1150 V390"/>

  <rect class="box control" x="130" y="555" width="250" height="85"/>
  <text class="label" x="255" y="591">staging-accept</text>
  <text class="small" x="255" y="617">durable runner + collectors</text>

  <rect class="box" x="445" y="555" width="250" height="85"/>
  <text class="label" x="570" y="589">Evidence bundle</text>
  <text class="small" x="570" y="616">append-only · redacted · hashed</text>

  <rect class="box" x="760" y="555" width="260" height="85"/>
  <text class="label" x="890" y="589">Independent verifiers</text>
  <text class="small" x="890" y="616">black-box + adversarial + soak</text>

  <polygon points="1150,540 1260,597 1150,654 1040,597" fill="#fff4d6" stroke="#52606d" stroke-width="2"/>
  <text class="label" x="1150" y="592">Release</text>
  <text class="small" x="1150" y="616">result</text>

  <rect class="box success" x="1330" y="515" width="220" height="70"/>
  <text class="label" x="1440" y="557">Accepted</text>
  <rect class="box failure" x="1330" y="630" width="220" height="70"/>
  <text class="label" x="1440" y="672">AI repair loop</text>

  <path class="line" d="M250 468 V555"/>
  <path class="line" d="M550 468 V515 H255 V555"/>
  <path class="line" d="M850 468 V515 H255 V555"/>
  <path class="line" d="M1150 468 V500 H255 V555"/>
  <path class="line" d="M380 597 H445"/>
  <path class="line" d="M695 597 H760"/>
  <path class="line" d="M1020 597 H1040"/>
  <path class="line" d="M1260 574 H1330"/>
  <text class="edge" x="1295" y="558">PASS</text>
  <path class="line" d="M1260 620 L1330 652"/>
  <text class="edge" x="1295" y="645">FAIL</text>
  <path class="line" d="M1440 630 V495 H380 V555"/>
  <path class="line" d="M1150 540 V210 H987 V183"/>
  <text class="edge" x="1197" y="344">BLOCKED / decision</text>
</svg>
