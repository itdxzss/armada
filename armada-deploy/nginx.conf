upstream armada_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/saas;
    index index.html;

    access_log /var/log/nginx/armada.access.log;
    error_log  /var/log/nginx/armada.error.log warn;

    location /api/ {
        proxy_pass http://armada_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 公开渠道运行时接口只信任由边缘代理覆盖的访问域名，禁止透传客户端伪造值。
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    location ^~ /static/js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /stale-chunk-reload.js;
    }

    location = /stale-chunk-reload.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # 新增：动态推广码进入约会二代页面
    location ~ "^/[A-Za-z0-9_-]{6,32}(?:/[0-9]{1,32})?/?$" {
        add_header Cache-Control "no-cache";
        try_files /date-v2.html =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
